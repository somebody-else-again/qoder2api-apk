plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qoder.gateway'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qoder.gateway'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // assets 里的 ELF 通过 getAssets().open() 读取：AssetManager 会透明解压，
    // 无需 noCompress（AGP 8.x 已移除该 DSL）。
}
